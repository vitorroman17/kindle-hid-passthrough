# BLE/Classic HID Host Configuration

[paths]
cache_dir = /mnt/us/kindle_hid_passthrough/cache
devices_config = /mnt/us/kindle_hid_passthrough/devices.conf

[connection]
reconnect_delay = 5
hci_reset_timeout = 10
connect_timeout = 30
transport_timeout = 30

[transport]
# hci_transport = file:/dev/stpbt

[device]
name = Kindle-HID
address = F0:F0:F0:F0:F0:F0

[protocol]
# Default protocol: ble or classic
type = classic

[classic]
# BR/EDR role handling when the peer pages us first.
#   keep            leave the role the peer assigned (default; measured best)
#   switch          request HCI_Switch_Role to central, then authenticate + encrypt
#   switch_no_auth  request the switch, but never call authenticate()
role_policy = keep

[logging]
log_file = /var/log/hid_passthrough.log
